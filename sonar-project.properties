# Smart Farm — configuration SonarQube
sonar.projectKey=smart-farm-web
sonar.projectName=Smart Farm Web
sonar.projectVersion=1.0

# Racine du depot
sonar.sources=src,backend/app
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Exclusions (build, dependances, assets)
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/public/**,**/*.min.js,**/storage/**,**/bootstrap/cache/**

# PHP (Laravel)
sonar.php.coverage.reportPaths=backend/build/coverage/clover.xml

# JavaScript / TypeScript (React) — optionnel si vous generez lcov
# sonar.javascript.lcov.reportPaths=coverage/lcov.info